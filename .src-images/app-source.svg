<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!--
    The App Store banner. Kept to the icon on the brand colour, with no text:
    the store renders it at 250x175, where any wording is unreadable, and text
    baked into an image cannot be translated.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12938F"/>
      <stop offset="1" stop-color="#0A5F5E"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg)"/>

  <g transform="translate(268 12) scale(0.66)" fill="none" stroke="#FFFFFF"
     stroke-width="34" stroke-linejoin="round" stroke-linecap="round">
    <rect x="352" y="136" width="320" height="752" rx="44"/>
    <path d="M428 236H596"/>
    <path d="M428 288H596"/>
    <path d="M428 340H596"/>
    <path d="M352 400H672"/>
    <path d="M556 440L428 672H500L468 840L596 608H524Z" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
